name: Verify Human Identity
on:
  workflow_dispatch: # Memungkinkan dijalankan manual

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          npm install -g clacp
          npm install

      - name: Create Ethereum Identity
        run: node scripts/createEthereumIdentity.js
        env:
          # Pastikan Anda sudah mengatur secret ini di settings repository
          PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}

      - name: Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name":"cryptoIndor-labs","description":"..."}'
